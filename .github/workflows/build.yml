name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build:
    name: Build .ovl
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup devkitPro environment
        run: |
          git config --global --add safe.directory '*'
          export DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}
          export DEVKITA64=${DEVKITA64:-${DEVKITPRO}/devkitA64}
          echo "DEVKITPRO=${DEVKITPRO}" >> $GITHUB_ENV
          echo "DEVKITA64=${DEVKITA64}" >> $GITHUB_ENV
          echo "${DEVKITA64}/bin" >> $GITHUB_PATH
          echo "${DEVKITPRO}/tools/bin" >> $GITHUB_PATH

      - name: Set version with CI suffix
        id: version
        run: |
          BASE_VERSION=$(cat .ryazhenka-version | tr -d '[:space:]')
          SHORT_SHA=$(git rev-parse --short HEAD)
          CI_VERSION="${BASE_VERSION}+ryazh.${SHORT_SHA}"
          echo "BASE_VERSION=${BASE_VERSION}" >> $GITHUB_ENV
          echo "CI_VERSION=${CI_VERSION}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          apt-get update -q
          apt-get install -y -q zip python3

      - name: Build
        run: make all CI_VERSION_SUFFIX="${SHORT_SHA}"

      - name: Verify RYZH signature
        run: |
          OVL_FILE="out/ovlEdiZon.ovl"
          LAST4=$(tail -c 4 "${OVL_FILE}" | od -A n -t x1 | tr -d ' \n')
          EXPECTED=$(printf 'RYZH' | od -A n -t x1 | tr -d ' \n')
          echo "Signature bytes: ${LAST4}"
          if [ "${LAST4}" != "${EXPECTED}" ]; then
            echo "ERROR: Expected RYZH signature, got ${LAST4}"
            exit 1
          fi
          echo "RYZH signature verified."

      - name: Create BUILD_INFO.txt
        run: |
          cat > BUILD_INFO.txt <<EOF
          App:            EdiZon
          Version:        ${CI_VERSION}
          Base version:   ${BASE_VERSION}
          Commit:         ${{ github.sha }}
          Ref:            ${{ github.ref }}
          Run:            ${{ github.run_number }}
          Author:         Dimasick-git
          Commit author:  ${{ github.actor }}
          Built:          $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF

      - name: Package artifact
        run: |
          mkdir -p dist
          cp out/ovlEdiZon.ovl dist/
          cp SdOut/EdiZon-Overlay.zip dist/EdiZon-Overlay-ci.zip
          cd dist
          zip -u EdiZon-Overlay-ci.zip ../BUILD_INFO.txt
          cd ..

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdiZon-Overlay-${{ env.SHORT_SHA }}
          path: |
            dist/ovlEdiZon.ovl
            dist/EdiZon-Overlay-ci.zip
          retention-days: 30

  auto-release:
    name: Auto release (latest-build)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version info
        run: |
          BASE_VERSION=$(cat .ryazhenka-version | tr -d '[:space:]')
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "BASE_VERSION=${BASE_VERSION}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "CI_VERSION=${BASE_VERSION}+ryazh.${SHORT_SHA}" >> $GITHUB_ENV

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: EdiZon-Overlay-${{ env.SHORT_SHA }}
          path: dist/

      - name: Force-move latest-build tag
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git tag -f latest-build
          git push origin latest-build --force

      - name: Publish latest-build release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Latest Build — ${{ env.CI_VERSION }}"
          body: |
            Automated build from commit `${{ github.sha }}`.

            **Version:** `${{ env.CI_VERSION }}`
            **Author:** Dimasick-git
            **Commit author:** ${{ github.actor }}
          prerelease: false
          make_latest: "true"
          files: |
            dist/ovlEdiZon.ovl
            dist/EdiZon-Overlay-ci.zip
