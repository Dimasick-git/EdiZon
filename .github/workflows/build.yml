name: Build & Release

defaults:
  run:
    shell: bash

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Install 7z
        run: apt-get update -qq && apt-get install -y p7zip-full

      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0
      - name: libryazhahand-deko (private, deploy key)
        env:
          DEKO_KEY: ${{ secrets.LIBRYAZHAHAND_DEKO_KEY }}
        run: |
          command -v ssh >/dev/null 2>&1 || { if command -v apt-get >/dev/null 2>&1 && [ "$(id -u)" = 0 ]; then apt-get update -qq && apt-get install -y -qq openssh-client; else sudo apt-get install -y -qq openssh-client; fi; }
          mkdir -p ~/.ssh && printf '%s\n' "$DEKO_KEY" > ~/.ssh/libryazhahand-deko && chmod 600 ~/.ssh/libryazhahand-deko
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global --add safe.directory '*'
          git config --global url."git@github.com:Dimasick-git/libryazhahand-deko".insteadOf "https://github.com/Dimasick-git/libryazhahand-deko"
          git config --global core.sshCommand "ssh -i $HOME/.ssh/libryazhahand-deko -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          git submodule update --init --recursive

      - name: Fix git safe.directory
        run: git config --global --add safe.directory '*'

      - name: Build libnx with HOS 23 APIs
        run: |
          git clone https://github.com/switchbrew/libnx.git "$RUNNER_TEMP/libnx"
          git -C "$RUNNER_TEMP/libnx" checkout --detach feebd026ca0f5dcc2119f46ad8e0d16ad3dd4973
          make -C "$RUNNER_TEMP/libnx" -j"$(nproc)"
          make -C "$RUNNER_TEMP/libnx" install
          "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-gcc" --version

      - name: Build and verify overlay
        run: |
          make -j"$(nproc)"
          python3 - <<'PY'
          from pathlib import Path
          data = Path('out/ovlEdiZon.ovl').read_bytes()
          assert data[16:20] == b'NRO0'
          assert data[-4:] == b'RYZH'
          PY
          mkdir -p dist/sd-root/switch/.overlays
          cp out/ovlEdiZon.ovl dist/sd-root/switch/.overlays/
          cd dist/sd-root
          7z a ../EdiZon-Overlay.zip ./switch

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: EdiZon-Overlay
          path: dist/EdiZon-Overlay.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: EdiZon-Overlay

      - name: Resolve tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: EdiZon-Overlay ${{ steps.tag.outputs.tag }}
          generate_release_notes: false
          body: |
            Обновлена libryazhahand. Компактный текст и элементы в оверлее.
          files: EdiZon-Overlay.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
