name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build:
    name: Build .ovl
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    outputs:
      short_sha: ${{ steps.version.outputs.short_sha }}
      base_version: ${{ steps.version.outputs.base_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup devkitPro environment
        run: |
          git config --global --add safe.directory '*'
          export DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}
          export DEVKITA64=${DEVKITA64:-${DEVKITPRO}/devkitA64}
          echo "DEVKITPRO=${DEVKITPRO}" >> $GITHUB_ENV
          echo "DEVKITA64=${DEVKITA64}" >> $GITHUB_ENV
          echo "${DEVKITA64}/bin" >> $GITHUB_PATH
          echo "${DEVKITPRO}/tools/bin" >> $GITHUB_PATH

      - name: Set version
        id: version
        run: |
          BASE_VERSION=$(cat .ryazhenka-version | tr -d '[:space:]')
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "BASE_VERSION=${BASE_VERSION}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "base_version=${BASE_VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          apt-get update -q
          apt-get install -y -q zip python3

      - name: Build
        run: make all CI_VERSION_SUFFIX="${SHORT_SHA}"

      - name: Verify RYZH signature
        run: |
          OVL_FILE="out/ovlEdiZon.ovl"
          LAST4=$(tail -c 4 "${OVL_FILE}" | od -A n -t x1 | tr -d ' \n')
          EXPECTED=$(printf 'RYZH' | od -A n -t x1 | tr -d ' \n')
          echo "Signature bytes: ${LAST4}"
          if [ "${LAST4}" != "${EXPECTED}" ]; then
            echo "ERROR: Expected RYZH signature, got ${LAST4}"
            exit 1
          fi
          echo "RYZH signature verified."

      - name: Create BUILD_INFO.txt
        run: |
          cat > BUILD_INFO.txt <<EOF
          App:            EdiZon
          Version:        ${BASE_VERSION}
          Commit:         ${{ github.sha }}
          Ref:            ${{ github.ref }}
          Run:            ${{ github.run_number }}
          Author:         Dimasick-git
          Commit author:  ${{ github.actor }}
          Built:          $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF

      - name: Package artifact
        run: |
          VER="${BASE_VERSION}"
          mkdir -p dist
          cp out/ovlEdiZon.ovl dist/
          cp SdOut/EdiZon-Overlay.zip dist/EdiZon-Overlay-${VER}.zip
          cd dist && zip -u EdiZon-Overlay-${VER}.zip ../BUILD_INFO.txt && cd ..

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdiZon-Overlay-${{ env.SHORT_SHA }}
          path: |
            dist/ovlEdiZon.ovl
            dist/EdiZon-Overlay-${{ env.BASE_VERSION }}.zip
          retention-days: 30

  # ── release: на каждый push в main — форс-двигаем v{version} и обновляем релиз ──
  release:
    name: Release v${{ needs.build.outputs.base_version }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: EdiZon-Overlay-${{ needs.build.outputs.short_sha }}
          path: dist/

      - name: Force-move version tag
        run: |
          VER="${{ needs.build.outputs.base_version }}"
          TAG="v${VER}"
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git tag -f "${TAG}"
          git push origin "${TAG}" --force
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "VER=${VER}" >> $GITHUB_ENV

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "EdiZon ${{ env.VER }}"
          body: |
            **EdiZon Overlay ${{ env.VER }}**

            Built on libryazhahand. Per-overlay config: `/config/edizon/`

            **Author:** Dimasick-git
            **Commit:** `${{ github.sha }}`
          prerelease: false
          make_latest: "true"
          files: |
            dist/ovlEdiZon.ovl
            dist/EdiZon-Overlay-${{ env.VER }}.zip
