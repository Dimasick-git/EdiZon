name: Sync Upstream

on:
  schedule:
    - cron: "17 4 * * 1"  # Mondays at 04:17 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sync:
    name: Sync from upstream
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.email "dimaorynchukk@gmail.com"
          git config user.name "Dimasick-git"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/proferabg/EdiZon-Overlay.git || true
          git fetch upstream main

      - name: Merge upstream (no-commit) + restore + patch in one commit
        run: |
          git checkout -b sync/upstream-$(date +%Y%m%d)

          # Merge without auto-committing so we can clean up before the commit
          if ! git merge upstream/main -X ours --no-edit --allow-unrelated-histories --no-commit; then
            echo "::error::Upstream merge has unresolved conflicts; main is unchanged."
            git merge --abort || true
            exit 1
          fi

          # Restore protected paths immediately (before commit — keeps workflow files clean)
          bash scripts/restore_protected.sh

          # Apply ryazhenka patches on the staged tree
          bash scripts/apply_ryazhenka_patches.sh

          # Single clean commit: never contains upstream workflow files
          git add -A
          git diff --cached --quiet || git commit \
            -m "chore: sync upstream proferabg/EdiZon-Overlay $(date +%Y-%m-%d)"

      - name: Check for effective changes
        id: changes
        run: |
          if git diff --quiet origin/main...HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No effective upstream changes after protected paths and patches."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push sync branch
        if: steps.changes.outputs.has_changes == 'true'
        run: git push -u origin HEAD

      - name: Open pull request
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const branch = `sync/upstream-${new Date().toISOString().slice(0,10).replace(/-/g,'')}`;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open'
            });
            if (prs.length === 0) {
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `chore: sync upstream ${new Date().toISOString().slice(0,10)}`,
                head: branch,
                base: 'main',
                body: [
                  '## Upstream sync',
                  '',
                  'Auto-merged from `proferabg/EdiZon-Overlay` with `-X theirs`.',
                  'Protected paths restored by `restore_protected.sh`.',
                  'Ryazhenka patches applied by `apply_ryazhenka_patches.sh`.',
                  '',
                  '**Author:** Dimasick-git',
                ].join('\n')
              });
            }
